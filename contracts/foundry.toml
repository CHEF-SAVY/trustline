[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"          # matches Flare's EVM config
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "./test/fixtures" },
]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "flare-periphery/=lib/flare-foundry-periphery-package/src/",
]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"

[etherscan]
coston2 = { key = "${FLARE_EXPLORER_API_KEY}", chain = 114, url = "https://coston2-explorer.flare.network/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
